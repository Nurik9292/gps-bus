services:
  db-route:
    image: postgis/postgis
    container_name: db-route
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.utf8 --lc-ctype=en_US.utf8"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
    volumes:
      - postgres_data_bus_route:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - bus-route-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-route:
    image: redis
    container_name: redis-route
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data_bus_route:/data
    networks:
      - bus-route-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend:latest
    container_name: bus-route-osrm
    volumes:
      - ./docker/osrm/data:/data
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/turkmenistan.osrm
    networks:
      - bus-route-network
    restart: unless-stopped

  nominatim:
    image: mediagis/nominatim:5.2
    container_name: bus-route-nominatim
    environment:
      PBF_URL: https://download.geofabrik.de/asia/turkmenistan-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/turkmenistan-updates/
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      IMPORT_STYLE: full
    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
    networks:
      - bus-route-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60m
    restart: unless-stopped

  bus-route-app:
    image: bus-route-backend-bus-route-app
    container_name: bus-route-app-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db-route
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis-route
      REDIS_PORT: 6379
      OSRM_BASE_URL: http://bus-route-osrm:5000
      NOMINATIM_BASE_URL: http://bus-route-nominatim:8080
      GPS_API_BASE_URL: ${GPS_API_BASE_URL}
      GPS_API_TOKEN: ${GPS_API_TOKEN}
      BUS_INFO_API_BASE_URL: ${BUS_INFO_API_BASE_URL}
      BUS_INFO_API_USERNAME: ${BUS_INFO_API_USERNAME}
      BUS_INFO_API_PASSWORD: ${BUS_INFO_API_PASSWORD}
      AVATAR_STORAGE_PATH: /app/data/avatars
      AVATAR_BASE_URL: http://${SERVER_HOST}/uploads/avatars
      AVATAR_CREATE_THUMBNAILS: false
      AVATAR_THUMBNAIL_SIZE: 150
      AVATAR_JPEG_QUALITY: 0.85
      BANNER_STORAGE_PATH: /app/data/banners
      BANNER_BASE_URL: http://${SERVER_HOST}/uploads/banners
      BANNER_CREATE_THUMBNAILS: false
      BANNER_THUMBNAIL_WIDTH: 400
      BANNER_THUMBNAIL_HEIGHT: 200
      BANNER_JPEG_QUALITY: 0.85
      JAVA_OPTS: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:+UseStringDeduplication -XX:MaxGCPauseMillis=200"
      JVM_OPTS: "-server -Djava.awt.headless=true -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "127.0.0.1:8080:8080"   # только localhost — nginx подключается отсюда
    volumes:
      - app_avatars:/app/data/avatars
      - app_banners:/app/data/banners
      - ./logs:/app/logs
    depends_on:
      db-route:
        condition: service_healthy
      redis-route:
        condition: service_healthy
    networks:
      - bus-route-network
      - shared-network
    restart: unless-stopped

networks:
  bus-route-network:
    driver: bridge
    name: bus-route-network
  shared-network:
    external: true
    name: shared-network

volumes:
  postgres_data_bus_route:
    name: bus-route-postgres-data
  redis_data_bus_route:
    name: bus-route-redis-data
  nominatim_data:
    name: bus-route-nominatim-data
  app_avatars:
    name: bus-route-avatars
  app_banners:
    name: bus-route-banners
