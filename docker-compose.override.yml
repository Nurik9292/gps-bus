services:
  db-route:
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_bus_route:/var/lib/postgresql/data
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d/migration
      - ./docker/postgres/dev-data.sql:/docker-entrypoint-initdb.d/99-dev-data.sql

  redis-route:
    command: redis-server --loglevel debug --appendonly yes

  bus-route-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bus-route-app-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db-route
      DB_PORT: 5432
      REDIS_HOST: redis-route
      REDIS_PORT: 6379
      GPS_API_BASE_URL: http://wiremock:8080/mock/gps/api
      BUS_INFO_API_BASE_URL: http://wiremock:8080/mock/bus-info
      JAVA_OPTS: "-Xms512m -Xmx1g"
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - .:/workspace
      - ~/.m2:/home/appuser/.m2
      - ./logs:/workspace/logs
    depends_on:
      db-route:
        condition: service_healthy
      redis-route:
        condition: service_healthy
      wiremock:
        condition: service_started
    networks:
      - bus-route-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s