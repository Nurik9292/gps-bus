# Russian messages
# Error codes from BaseController.ErrorCode

# Client errors (4xx)
INVALID_REQUEST=Неверные параметры запроса
VALIDATION_ERROR=Ошибка валидации
NOT_FOUND=Ресурс не найден
UNAUTHORIZED=Требуется аутентификация
FORBIDDEN=Доступ запрещен
CONFLICT=Конфликт ресурсов

# Server errors (5xx)
INTERNAL_ERROR=Произошла непредвиденная ошибка
SERVICE_UNAVAILABLE=Сервис временно недоступен
EXTERNAL_SERVICE_ERROR=Ошибка внешнего сервиса

