# Client errors (4xx)
INVALID_REQUEST=Неверные параметры запроса
VALIDATION_ERROR=Проверка не удалась
NOT_FOUND=Ресурс не найден
UNAUTHORIZED=Требуется аутентификация
FORBIDDEN=Доступ запрещен
CONFLICT=Конфликт ресурсов

# Server errors (5xx)
INTERNAL_ERROR=Произошла непредвиденная ошибка
SERVICE_UNAVAILABLE=Сервис временно недоступен
EXTERNAL_SERVICE_ERROR=Ошибка внешней службы

# Common messages
success=Операция завершена успешно
error=Произошла ошибка
created=Ресурс успешно создан
updated=Ресурс успешно обновлен
deleted=Ресурс успешно удален

# Bus route specific messages
route.not.found=Маршрут автобуса не найден
route.created=Автобусный маршрут успешно создан
route.updated=Маршрут автобуса успешно обновлен
route.deleted=Автобусный маршрут успешно удален

# Bus stop specific messages
stop.not.found=Автобусная остановка не найдена
stop.created=Автобусная остановка успешно создана
stop.updated=Автобусная остановка успешно обновлена
stop.deleted=Автобусная остановка успешно удалена

# User management messages
user.not.found=Пользователь не найден
user.created=Пользователь успешно создан
user.updated=Пользователь обновлен успешно
user.deleted=Пользователь успешно удален
user.authenticated=Пользователь успешно авторизован
user.logout=Пользователь успешно вышел из системы

# Banner messages
banner.not.found=Баннер не найден
banner.created=Баннер успешно создан
banner.updated=Баннер успешно обновлен
banner.deleted=Баннер успешно удален

# City messages
city.not.found=Город не найден
city.created=Город создан успешно
city.updated=Город успешно обновлен
city.deleted=Город успешно удален

# Validation messages
validation.required=Это поле обязательно к заполнению
validation.invalid.email=Неверный формат электронной почты
validation.invalid.phone=Неверный формат номера телефона
validation.min.length=Минимальная длина {0} символов
validation.max.length=Максимальная длина {0} символов
validation.invalid.coordinates=Указаны неверные координаты

# ========================================
# Exception Error Codes
# ========================================

# Admin Context
ADMIN.NOT_FOUND=Пользователь-администратор не найден
ADMIN.ALREADY_EXISTS=Пользователь-администратор уже существует
ADMIN.AUTHENTICATION_ERROR=Ошибка аутентификации администратора
ADMIN.TOKEN_ERROR=Ошибка аутентификации токена администратора
ADMIN.VALIDATION_ERROR=Проверка администратора не удалась
ADMIN.PASSWORD_ERROR=Ошибка проверки пароля администратора
ADMIN.DELETE_ERROR=Невозможно удалить пользователя-администратора
ADMIN.CONCURRENCY_ERROR=Ошибка конкурентного доступа администратора
ADMIN.OPERATION_ERROR=Ошибка операции администратора
ADMIN.REPOSITORY_ERROR=Ошибка работы с базой данных администратора

# Client Context
CLIENT.NOT_FOUND=Клиент не найден
CLIENT.ALREADY_EXISTS=Клиент уже существует
CLIENT.AUTHENTICATION_ERROR=Ошибка аутентификации клиента
CLIENT.VALIDATION_ERROR=Проверка клиента не удалась
CLIENT.INVALID_CREDENTIALS=Неверный email или пароль
CLIENT.ACCOUNT_LOCKED=Аккаунт заблокирован
CLIENT.ACCOUNT_DISABLED=Аккаунт отключен
CLIENT.ACCOUNT_NOT_VERIFIED=Аккаунт не подтвержден по электронной почте
CLIENT.TOKEN_EXPIRED=Срок действия токена аутентификации истек
CLIENT.TOKEN_INVALID=Неверный токен аутентификации
CLIENT.SESSION_EXPIRED=Срок действия сеанса истек

# Transport Context
TRANSPORT.ROUTE_NOT_FOUND=Маршрут автобуса не найден
TRANSPORT.BUS_STOP_NOT_FOUND=Автобусная остановка не найдена
TRANSPORT.VEHICLE_NOT_FOUND=Транспортное средство не найдено
TRANSPORT.REAL_TIME_DATA_ERROR=Ошибка данных в реальном времени
TRANSPORT.DATA_UNAVAILABLE=Данные в реальном времени в настоящее время недоступны
TRANSPORT.STALE_DATA=Данные в реальном времени устарели
TRANSPORT.EXTERNAL_API_ERROR=Ошибка при взаимодействии с внешним поставщиком данных
TRANSPORT.PARSING_ERROR=Ошибка при разборе данных в реальном времени
TRANSPORT.TIMEOUT=Превышено время ожидания запроса к поставщику данных в реальном времени
TRANSPORT.RATE_LIMIT_EXCEEDED=Превышен лимит запросов к API данных в реальном времени

# Routing Context
ROUTING.TRIP_PLANNING_ERROR=Планирование поездки не удалось
ROUTING.ROUTE_CALCULATION_ERROR=Ошибка расчета маршрута
ROUTING.INVALID_LOCATION=Указано неверное местоположение
ROUTING.NO_ROUTE_FOUND=Маршрут не найден
ROUTING.INVALID_ORIGIN=Неверное местооположение отправления
ROUTING.INVALID_DESTINATION=Неверное местооположение назначения
ROUTING.SAME_ORIGIN_DESTINATION=Место отправления и место назначения совпадают
ROUTING.DISTANCE_TOO_LONG=Расстояние между местом отправления и местом назначения слишком велико
ROUTING.NO_SERVICE_AVAILABLE=Нет доступного автобусного сообщения на запрошенное время
ROUTING.INVALID_TIME=Указано неверное время поездки
ROUTING.TOO_MANY_TRANSFERS=Не найден маршрут с приемлемым количеством пересадок
ROUTING.CALCULATION_TIMEOUT=Превышено время ожидания расчета маршрута

# Security Context
SECURITY.ACCESS_DENIED=Доступ запрещен — недостаточно прав
SECURITY.AUTHENTICATION_REQUIRED=Требуется аутентификация
SECURITY.JWT_ERROR=Ошибка JWT токена
SECURITY.JWT_INVALID=Неверный JWT токен
SECURITY.JWT_EXPIRED=Срок действия JWT токена истек
SECURITY.JWT_BLACKLISTED=JWT токен был отозван

# Common Errors
INVALID_ARGUMENT=Предоставлен неверный аргумент
