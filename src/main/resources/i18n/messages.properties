# Client errors (4xx)
INVALID_REQUEST=Invalid request parameters
VALIDATION_ERROR=Validation failed
NOT_FOUND=Resource not found
UNAUTHORIZED=Authentication required
FORBIDDEN=Access denied
CONFLICT=Resource conflict

# Server errors (5xx)
INTERNAL_ERROR=An unexpected error occurred
SERVICE_UNAVAILABLE=Service temporarily unavailable
EXTERNAL_SERVICE_ERROR=External service error

# Common messages
success=Operation completed successfully
error=An error occurred
created=Resource created successfully
updated=Resource updated successfully
deleted=Resource deleted successfully

# Bus route specific messages
route.not.found=Bus route not found
route.created=Bus route created successfully
route.updated=Bus route updated successfully
route.deleted=Bus route deleted successfully

# Bus stop specific messages
stop.not.found=Bus stop not found
