stop.updated=Bus stop updated successfully
stop.deleted=Bus stop deleted successfully

# User management messages
user.not.found=User not found
user.created=User created successfully
user.updated=User updated successfully
user.deleted=User deleted successfully
user.authenticated=User authenticated successfully
user.logout=User logged out successfully

# Banner messages
banner.not.found=Banner not found
banner.created=Banner created successfully
banner.updated=Banner updated successfully
banner.deleted=Banner deleted successfully

# City messages
city.not.found=City not found
city.created=City created successfully
city.updated=City updated successfully
city.deleted=City deleted successfully

