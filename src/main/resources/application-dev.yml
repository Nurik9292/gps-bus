spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/bus_route_db
    username: bus_route_user
    password: bus_route_pass
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/bus_route_db
    username: bus_route_user
    password: bus_route_pass
    pool:
      initial-size: 2
      max-size: 5
      max-idle-time: 10m
      max-acquire-time: 10s
      max-create-connection-time: 10s
      validation-query: SELECT 1

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  task:
    scheduling:
      pool:
        size: 1

logging:
  level:
    biz.ugur.busroutebackend: INFO
    org.springframework.web.reactive: INFO
    org.springframework.data: INFO
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO
    org.flywaydb: INFO

