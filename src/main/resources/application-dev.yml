spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bus_route}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD:bus_route_pass}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD:bus_route_pass}
    pool:
      initial-size: 2
      max-size: 5
      max-idle-time: 10m
      max-acquire-time: 10s
      max-create-connection-time: 10s
      validation-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  task:
    scheduling:
      pool:
        size: 1

logging:
  level:
    biz.ugur.busroutebackend: INFO
    org.springframework.web.reactive: INFO
    org.springframework.data: INFO
    org.springframework.r2dbc: INFO
    io.r2dbc.postgresql: INFO
    org.flywaydb: INFO
    biz.ugur.busroutebackend.transport.application.usecase.UpdateVehiclePositionsUseCase: DEBUG
    biz.ugur.busroutebackend.transport.domain.model.Vehicle: DEBUG
    biz.ugur.busroutebackend.transport.infrastructure.messaging.VehicleEventHandler: INFO
    biz.ugur.busroutebackend.interfaces.websocket.VehiclePositionHandler: DEBUG
    biz.ugur.busroutebackend.transport.scheduler.VehicleDataScheduler: INFO
    org.springframework.context.event: DEBUG

