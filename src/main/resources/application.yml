spring:
  application:
    name: bus-route-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD:bus_route_pass}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD:bus_route_pass}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:bus_route_db}
    pool:
      initial-size: ${DB_POOL_MIN_IDLE:2}
      max-size: ${DB_POOL_MAX_SIZE:10}
      max-idle-time: 30m
      max-acquire-time: 60s
      max-create-connection-time: 60s
      validation-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    schemas: public

  webflux:
    multipart:
      max-in-memory-size: 5MB
      max-disk-usage-per-part: 10MB
      max-parts: 10

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null




app:
  scheduling:
    enabled: true

  scheduler:
    gps:
      batch-size: ${SCHEDULER_GPS_BATCH_SIZE:100}
      parallel-workers: ${SCHEDULER_GPS_PARALLEL_WORKERS:4}
      batch-timeout: ${SCHEDULER_GPS_BATCH_TIMEOUT:30s}
      total-timeout: ${SCHEDULER_GPS_TOTAL_TIMEOUT:120s}

  eta:
    position:
      max-age-minutes: ${ETA_POSITION_MAX_AGE_MINUTES:10}
      at-stop-distance-meters: ${ETA_AT_STOP_DISTANCE_METERS:200}
      max-eta-minutes: ${ETA_MAX_MINUTES:60}
    speed:
      moving-threshold-kmh: ${ETA_SPEED_MOVING_THRESHOLD:5.0}
      morning-rush-kmh: ${ETA_SPEED_MORNING_RUSH:12.0}
      evening-rush-kmh: ${ETA_SPEED_EVENING_RUSH:12.0}
      lunch-time-kmh: ${ETA_SPEED_LUNCH_TIME:18.0}
      normal-kmh: ${ETA_SPEED_NORMAL:25.0}
      night-kmh: ${ETA_SPEED_NIGHT:30.0}
    cache:
      stop-arrivals-ttl-seconds: ${ETA_CACHE_STOP_ARRIVALS_TTL:15}
      waiting-time-ttl-minutes: ${ETA_CACHE_WAITING_TIME_TTL:10}
      travel-time-ttl-minutes: ${ETA_CACHE_TRAVEL_TIME_TTL:30}
    traffic:
      morning-rush: ${ETA_TRAFFIC_MORNING_RUSH:1.2}
      evening-rush: ${ETA_TRAFFIC_EVENING_RUSH:1.4}
      daytime: ${ETA_TRAFFIC_DAYTIME:1.1}
      evening: ${ETA_TRAFFIC_EVENING:1.1}
      night: ${ETA_TRAFFIC_NIGHT:0.9}
      weekend-factor: ${ETA_TRAFFIC_WEEKEND_FACTOR:0.8}

  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}
    password-expiry-days: 90
    validation:
      coordinates:
        turkmenistan:
          min-latitude: 35.0
          max-latitude: 43.0
          min-longitude: 52.0
          max-longitude: 67.0


  security:
    jwt:
      admin:
        secret: ${JWT_ADMIN_SECRET:${JWT_SECRET:9b3f7d1a6e2c48f5b0a7d3e9c1f6b2a8d4e7c0f5a9b3d6e1c8f2a4b7d9e0c1f3}}
        access-token-expiration: "PT1H"    # 1 hour
        refresh-token-expiration: "P7D"    # 7 daysdjn
        issuer: "bus-route-system"
      client:
        secret: ${JWT_CLIENT_SECRET:${JWT_SECRET:f7c1d8e9a24b43e0c5f9127aa9d3e6bf72c14a8d59f0be3c6d8f1e2a7c9b4d01}}
        access-token-expiration: "P31D"   # 744 hours (31 days)
        refresh-token-expiration: "P90D"  # 912 days
        issuer: "bus-route-system"

  storage:
    avatars:
      base-path: ${AVATAR_STORAGE_PATH:/home/user/bus/bus_route_backend/app/data/avatars}
      base-url: ${AVATAR_BASE_URL:http://localhost:8080/uploads/avatars}
      max-size-mb: ${AVATAR_MAX_SIZE_MB:2}
      create-thumbnails: ${AVATAR_CREATE_THUMBNAILS:false}
      thumbnail-size: ${AVATAR_THUMBNAIL_SIZE:150}
      jpeg-quality: ${AVATAR_JPEG_QUALITY:0.85}

    banners:
      base-path: ${BANNER_STORAGE_PATH:/home/user/bus_route_backend/app/data/banners}
      base-url: ${BANNER_BASE_URL:http://localhost:8080/uploads/banners}
      max-size-mb: 10
      create-thumbnails: ${BANNER_CREATE_THUMBNAILS:false}
      thumbnail-width: ${BANNER_THUMBNAIL_WIDTH:400}
      thumbnail-height: ${BANNER_THUMBNAIL_HEIGHT:200}
      jpeg-quality: ${BANNER_JPEG_QUALITY:0.85}


