spring:
  application:
    name: bus-route-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:bus_route_db}
    pool:
      initial-size: ${DB_POOL_MIN_IDLE:5}
      max-size: ${DB_POOL_MAX_SIZE:25}
      max-idle-time: 30s
      max-life-time: 300s
      max-acquire-time: 5s
      max-create-connection-time: 5s
      validation-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 30
          max-idle: 20
          min-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    schemas: public
    ignore-migration-patterns: "*:ignored"

  webflux:
    multipart:
      max-in-memory-size: 5MB
      max-disk-usage-per-part: 10MB
      max-parts: 10

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null

app:
  prediction:
    v31:
      enabled: ${APP_PREDICTION_V31_ENABLED:false}
      broadcast: ${APP_PREDICTION_V31_BROADCAST:off}
      routes-allowlist: ${APP_PREDICTION_V31_ROUTES:}
      w-broadcast-hz: ${APP_PREDICTION_V31_HZ:1.0}
      t-heartbeat-sec: ${APP_PREDICTION_V31_HEARTBEAT:5}
      cityzone:
        routes:
          "[61]":
            d-lat: 38.050990
            d-lon: 58.170747
            p-lat: 38.058718
            p-lon: 58.175667
  mail:
    enabled: ${MAIL_ENABLED:false}
    admin-email: ${ADMIN_EMAIL:admin@busroute.tm}
    from: ${MAIL_FROM:noreply@busroute.tm}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    quiet-from-hour: ${MAIL_QUIET_FROM_HOUR:23}
    quiet-to-hour: ${MAIL_QUIET_TO_HOUR:7}

  gps-alerts:
    enabled: ${GPS_ALERT_ENABLED:false}
    recipients: ${GPS_ALERT_RECIPIENTS:}
    http-error:
      consecutive-failures: ${GPS_ALERT_HTTP_FAILS:3}
    empty:
      consecutive-empty: ${GPS_ALERT_EMPTY_FETCHES:3}
    drop:
      threshold-percent: ${GPS_ALERT_DROP_THRESHOLD_PCT:50}
      baseline-window-hours: ${GPS_ALERT_DROP_BASELINE_HOURS:24}
      min-baseline: ${GPS_ALERT_DROP_MIN_BASELINE:10}
    stale:
      max-fix-age-minutes: ${GPS_ALERT_STALE_MAX_AGE_MIN:5}
      degraded-percent: ${GPS_ALERT_STALE_PERCENT:95}
    recovery:
      clear-fetches: ${GPS_ALERT_RECOVERY_CLEAR:3}

  off-route-alerts:
    enabled: ${OFF_ROUTE_ALERT_ENABLED:false}
    recipients: ${OFF_ROUTE_ALERT_RECIPIENTS:${GPS_ALERT_RECIPIENTS:}}
    end-of-shift-buffer-minutes: ${OFF_ROUTE_ALERT_END_BUFFER_MIN:15}
    min-on-route-seconds: ${OFF_ROUTE_ALERT_MIN_ON_ROUTE_SEC:60}
    digest-interval-minutes: ${OFF_ROUTE_ALERT_DIGEST_MINUTES:15}
  fleet-presence-alerts:
    enabled: ${FLEET_PRESENCE_ALERTS_ENABLED:false}
    check-interval-minutes: ${FLEET_PRESENCE_CHECK_INTERVAL_MINUTES:10}
    silent-threshold-minutes: ${FLEET_PRESENCE_SILENT_THRESHOLD_MINUTES:15}
    startup-grace-minutes: ${FLEET_PRESENCE_STARTUP_GRACE_MINUTES:20}
    min-resend-cooldown-minutes: ${FLEET_PRESENCE_MIN_RESEND_COOLDOWN_MINUTES:60}
    max-rows-per-section: ${FLEET_PRESENCE_MAX_ROWS_PER_SECTION:50}

  scheduling:
    enabled: true

  scheduler:
    update-interval: ${SCHEDULER_UPDATE_INTERVAL:5s}
    active-hours:
      start: ${SCHEDULER_ACTIVE_HOUR_START:6}
      end: ${SCHEDULER_ACTIVE_HOUR_END:23}
      timezone: ${SCHEDULER_TIMEZONE:Asia/Ashgabat}
    gps:
      batch-size: ${SCHEDULER_GPS_BATCH_SIZE:100}
      parallel-workers: ${SCHEDULER_GPS_PARALLEL_WORKERS:2}
      batch-timeout: ${SCHEDULER_GPS_BATCH_TIMEOUT:10s}
      total-timeout: ${SCHEDULER_GPS_TOTAL_TIMEOUT:15s}

  eta:
    live-factor:
      write-enabled: ${ETA_LIVE_FACTOR_WRITE_ENABLED:true}
      mode: ${ETA_LIVE_FACTOR_MODE:shadow}
      excluded-axes: "${ETA_LIVE_FACTOR_EXCLUDED_AXES:3:0,4:0,5:1,45:1,59:0,59:1,63:1,64:0,65:0,66:0,66:1,74:1,77:1,78:1,100:1,101:1,102:1,108:0,108:1,142:0}"
    position:
      max-age-minutes: ${ETA_POSITION_MAX_AGE_MINUTES:10}
      max-fix-age-seconds: ${ETA_POSITION_MAX_FIX_AGE_SECONDS:120}
      at-stop-distance-meters: ${ETA_AT_STOP_DISTANCE_METERS:200}
      max-eta-minutes: ${ETA_MAX_MINUTES:60}
    speed:
      moving-threshold-kmh: ${ETA_SPEED_MOVING_THRESHOLD:5.0}
      morning-rush-kmh: ${ETA_SPEED_MORNING_RUSH:12.0}
      evening-rush-kmh: ${ETA_SPEED_EVENING_RUSH:12.0}
      lunch-time-kmh: ${ETA_SPEED_LUNCH_TIME:18.0}
      normal-kmh: ${ETA_SPEED_NORMAL:25.0}
      night-kmh: ${ETA_SPEED_NIGHT:30.0}
    cache:
      stop-arrivals-ttl-seconds: ${ETA_CACHE_STOP_ARRIVALS_TTL:15}
      waiting-time-ttl-minutes: ${ETA_CACHE_WAITING_TIME_TTL:10}
      travel-time-ttl-minutes: ${ETA_CACHE_TRAVEL_TIME_TTL:30}
    traffic:
      morning-rush: ${ETA_TRAFFIC_MORNING_RUSH:1.2}
      evening-rush: ${ETA_TRAFFIC_EVENING_RUSH:1.4}
      daytime: ${ETA_TRAFFIC_DAYTIME:1.1}
      evening: ${ETA_TRAFFIC_EVENING:1.1}
      night: ${ETA_TRAFFIC_NIGHT:0.9}
      weekend-factor: ${ETA_TRAFFIC_WEEKEND_FACTOR:0.8}
    terminal-departure:
      mode: ${TERMINAL_DEPARTURE_MODE:off}
      min-samples: ${TERMINAL_DEPARTURE_MIN_SAMPLES:5}
      floor-seconds: ${TERMINAL_DEPARTURE_FLOOR_SECONDS:60}
      max-stops: ${TERMINAL_DEPARTURE_MAX_STOPS:3}
      dwell-max-seconds: ${TERMINAL_DEPARTURE_DWELL_MAX_SECONDS:3600}

  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${ADMIN_DEFAULT_PASSWORD}
    password-expiry-days: 90
    validation:
      coordinates:
        turkmenistan:
          min-latitude: 35.0
          max-latitude: 43.0
          min-longitude: 52.0
          max-longitude: 67.0


  place:
    search:
      similarity-threshold: ${PLACE_SEARCH_WSIM_THRESHOLD:0.6}
      short-query-max-length: 3
      default-limit: 20
      max-limit: 50
      nearby-default-radius-meters: 500
      nearby-max-radius-meters: 5000

  security:
    jwt:
      admin:
        secret: ${JWT_ADMIN_SECRET:${JWT_SECRET}}
        access-token-expiration: "PT1H"    # 1 hour
        refresh-token-expiration: "P7D"    # 7 days
        issuer: "bus-route-system"
      client:
        secret: ${JWT_CLIENT_SECRET:${JWT_SECRET}}
        access-token-expiration: ${JWT_CLIENT_ACCESS_EXPIRATION:P31D}
        refresh-token-expiration: ${JWT_CLIENT_REFRESH_EXPIRATION:P90D}
        issuer: "bus-route-system"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  storage:
    avatars:
      base-path: ${AVATAR_STORAGE_PATH:/home/developer/projects/bus/ugur_v4/bus-route-backend/app/data/avatars}
      base-url: ${AVATAR_BASE_URL:http://localhost:8080/uploads/avatars}
      max-size-mb: ${AVATAR_MAX_SIZE_MB:2}
      create-thumbnails: ${AVATAR_CREATE_THUMBNAILS:false}
      thumbnail-size: ${AVATAR_THUMBNAIL_SIZE:150}
      jpeg-quality: ${AVATAR_JPEG_QUALITY:0.85}

    banners:
      base-path: ${BANNER_STORAGE_PATH:/home/developer/projects/bus/ugur_v4/bus-route-backend/app/data/banners}
      base-url: ${BANNER_BASE_URL:http://localhost:8080/uploads/banners}
      max-size-mb: 10
      create-thumbnails: ${BANNER_CREATE_THUMBNAILS:false}
      thumbnail-width: ${BANNER_THUMBNAIL_WIDTH:400}
      thumbnail-height: ${BANNER_THUMBNAIL_HEIGHT:200}
      jpeg-quality: ${BANNER_JPEG_QUALITY:0.85}

    ad-placements:
      base-path: ${AD_PLACEMENT_STORAGE_PATH:/home/developer/projects/bus/ugur_v4/bus-route-backend/app/data/ad-placements}
      base-url: ${AD_PLACEMENT_BASE_URL:http://localhost:8080/uploads/ad-placements}
      max-size-mb: ${AD_PLACEMENT_MAX_SIZE_MB:10}
      create-thumbnails: ${AD_PLACEMENT_CREATE_THUMBNAILS:false}
      thumbnail-width: ${AD_PLACEMENT_THUMBNAIL_WIDTH:400}
      thumbnail-height: ${AD_PLACEMENT_THUMBNAIL_HEIGHT:200}
      jpeg-quality: ${AD_PLACEMENT_JPEG_QUALITY:0.85}


external:
  api:
    gps:
      enabled: ${GPS_API_ENABLED:true}
      base-url: ${GPS_API_BASE_URL:http://95.85.97.118/app-overseas-newenergy-core}
      token: ${GPS_API_TOKEN}
      timeout: ${GPS_API_TIMEOUT:30s}
      connect-timeout: ${GPS_API_CONNECT_TIMEOUT:10s}
      read-timeout: ${GPS_API_READ_TIMEOUT:60s}
      write-timeout: ${GPS_API_WRITE_TIMEOUT:10s}
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s
      rate-limit:
        requests-per-minute: 60

    gps-common:
      retry:
        max-attempts: ${GPS_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${GPS_RETRY_INITIAL_INTERVAL:1s}
        max-interval: ${GPS_RETRY_MAX_INTERVAL:5s}
        multiplier: ${GPS_RETRY_MULTIPLIER:2.0}
      timeout:
        request: ${GPS_REQUEST_TIMEOUT:30s}
        health-check: ${GPS_HEALTH_CHECK_TIMEOUT:10s}
      optimization:
        selective-fetch-enabled: ${GPS_SELECTIVE_FETCH_ENABLED:false}
        selective-fetch-threshold: ${GPS_SELECTIVE_FETCH_THRESHOLD:10}
        parallel-fetch-concurrency: ${GPS_PARALLEL_FETCH_CONCURRENCY:5}
        log-strategy-decisions: ${GPS_LOG_STRATEGY_DECISIONS:false}

    gps-tugdk:
      enabled: ${GPS_TUGDK_ENABLED:true}
      base-url: ${GPS_TUGDK_BASE_URL:https://gps.tugdk.gov.tm}
      timeout: ${GPS_TUGDK_TIMEOUT:30s}
      connect-timeout: ${GPS_TUGDK_CONNECT_TIMEOUT:10s}
      read-timeout: ${GPS_TUGDK_READ_TIMEOUT:60s}
      write-timeout: ${GPS_TUGDK_WRITE_TIMEOUT:10s}
      cache-timeout: ${GPS_TUGDK_CACHE_TIMEOUT:3s}
      tenant-cache-refresh-ms: ${GPS_TUGDK_TENANT_CACHE_REFRESH_MS:60000}
      default-tenant-id: ${GPS_TUGDK_DEFAULT_TENANT_ID:ASHGABAT}
      token: ${GPS_TUGDK_TOKEN:${GPS_API_TOKEN:}}
      tenants:
        - id: ASHGABAT
          token: ${GPS_API_TOKEN_ASHGABAT:${GPS_TUGDK_TOKEN:${GPS_API_TOKEN:}}}
        - id: BALKAN
          token: ${GPS_API_TOKEN_BALKAN:}
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s
      rate-limit:
        requests-per-minute: 60

    # ============================================================================
    # ВКЛЮЧЕНО ОБРАТНО 2026-08-08 (только чтение): реестр «борт → маршрут»
    # для route-swap provider cross-check. Auto-sync назначений (SyncBusRoute
    # AssignmentsUseCase) НЕ включать — unassign-ит все борта вне реестра.
    # insecure-tls: у edu.ayauk.gov.tm некорректная TLS-цепочка (проверено 29.07).
    # ============================================================================
    bus-info:
      base-url: ${BUS_INFO_API_BASE_URL:https://edu.ayauk.gov.tm}
      username: ${BUS_INFO_API_USERNAME:}
      password: ${BUS_INFO_API_PASSWORD:}
      insecure-tls: ${BUS_INFO_API_INSECURE_TLS:false}
      timeout: 10s
      connect-timeout: ${BUS_INFO_API_CONNECT_TIMEOUT:10s}
      read-timeout: ${BUS_INFO_API_READ_TIMEOUT:30s}
      write-timeout: ${BUS_INFO_API_WRITE_TIMEOUT:10s}
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s

    nominatim:
      enabled: ${NOMINATIM_ENABLED:true}
      base-url: ${NOMINATIM_BASE_URL:http://localhost:8088}
      timeout: ${NOMINATIM_TIMEOUT:10s}
      connect-timeout: ${NOMINATIM_CONNECT_TIMEOUT:3s}
      read-timeout: ${NOMINATIM_READ_TIMEOUT:10s}
      write-timeout: ${NOMINATIM_WRITE_TIMEOUT:3s}

    osrm:
      enabled: ${OSRM_ENABLED:true}
      base-url: ${OSRM_BASE_URL:http://localhost:5001}
      timeout: ${OSRM_TIMEOUT:3s}
      connect-timeout: ${OSRM_CONNECT_TIMEOUT:2s}
      read-timeout: ${OSRM_READ_TIMEOUT:3s}
      write-timeout: ${OSRM_WRITE_TIMEOUT:2s}

business:
  routing:
    nearby-stops-radius: 800
    max-transfers: 2
    max-search-results: 3
    max-transfer-wait-time: 30
    walking-speed: 5.0

    trip-scoring:
      max-initial-waiting-minutes: ${TRIP_SCORING_MAX_INITIAL_WAITING_MINUTES:60}
      quality-score:
        speed-weight: ${TRIP_SCORING_QUALITY_SPEED_WEIGHT:0.4}
        transfer-weight: ${TRIP_SCORING_QUALITY_TRANSFER_WEIGHT:0.3}
        walking-weight: ${TRIP_SCORING_QUALITY_WALKING_WEIGHT:0.2}
        comfort-weight: ${TRIP_SCORING_QUALITY_COMFORT_WEIGHT:0.1}
        speed-baseline-minutes: ${TRIP_SCORING_QUALITY_SPEED_BASELINE_MIN:100}
        transfer-penalty: ${TRIP_SCORING_QUALITY_TRANSFER_PENALTY:25}
        walking-penalty-per-minute: ${TRIP_SCORING_QUALITY_WALKING_PENALTY_PER_MIN:3}
      comfort-score:
        base: ${TRIP_SCORING_COMFORT_BASE:100.0}
        transfer-penalty: ${TRIP_SCORING_COMFORT_TRANSFER_PENALTY:15.0}
        walking-grace-minutes: ${TRIP_SCORING_COMFORT_WALKING_GRACE_MIN:5}
        walking-penalty-per-minute: ${TRIP_SCORING_COMFORT_WALKING_PENALTY_PER_MIN:2.0}
        travel-grace-minutes: ${TRIP_SCORING_COMFORT_TRAVEL_GRACE_MIN:30}
        travel-penalty-per-minute: ${TRIP_SCORING_COMFORT_TRAVEL_PENALTY_PER_MIN:0.5}
      reliability-score:
        base: ${TRIP_SCORING_RELIABILITY_BASE:0.95}
        transfer-penalty: ${TRIP_SCORING_RELIABILITY_TRANSFER_PENALTY:0.05}
        walking-grace-minutes: ${TRIP_SCORING_RELIABILITY_WALKING_GRACE_MIN:10}
        walking-penalty-per-minute: ${TRIP_SCORING_RELIABILITY_WALKING_PENALTY_PER_MIN:0.01}
        floor: ${TRIP_SCORING_RELIABILITY_FLOOR:0.5}

  vehicle-tracking:
    position-update-interval: 30
    position-max-age: 5
    stop-arrival-radius: 50

    route-assignment-priority:
      - SHIFT_ASSIGNMENT
      - GPS_DETECTED
      - MANUAL

  # ЗАКОММЕНТИРОВАНО 2025-12-23: Bus Info API sync больше не используется
  # bus-info:
  #   sync-interval: 24
  #   sync-time: "06:00"

  garage:
    entry-detection:
      min-idle-time-minutes: 10
      speed-threshold-kmh: 2.0

    exit-detection:
      min-distance-meters: 50
      min-speed-kmh: 5.0

  gps-route-detection:
    enabled: false  # ОТКЛЮЧЕНО: маршруты пересекаются, GPS детекция работает некорректно
    check-interval-seconds: 30
    min-gps-points: 5
    deviation-threshold-meters: 500
    min-confidence-percentage: 70.0
    max-distance-for-match-meters: 100

  route-swap-detector:
    enabled: ${ROUTE_SWAP_DETECTOR_ENABLED:false}
    mode: ${ROUTE_SWAP_DETECTOR_MODE:off}
    window-minutes: ${ROUTE_SWAP_WINDOW_MINUTES:10}
    verdict-windows: 6
    min-windows-for-verdict: 5
    min-moving-points-per-window: 3
    min-speed-kmh: 5.0
    on-route-meters: 100.0
    off-assigned-meters: 300.0
    competitor-clearance-meters: 250.0
    swap-assigned-coverage-max: 0.3
    swap-foreign-coverage-min: 0.6
    unique-minutes-min: 10
    assignment-grace-minutes: ${ROUTE_SWAP_ASSIGNMENT_GRACE_MINUTES:60}
    max-window-gap-minutes: ${ROUTE_SWAP_MAX_WINDOW_GAP_MINUTES:20}
    end-of-shift-buffer-minutes: ${ROUTE_SWAP_END_OF_SHIFT_BUFFER_MINUTES:20}
    family-mutual-share: 0.6
    overlap-tolerance-meters: 120.0
    digest-interval-minutes: ${ROUTE_SWAP_DIGEST_INTERVAL_MINUTES:30}
    provider-check-enabled: ${ROUTE_SWAP_PROVIDER_CHECK_ENABLED:false}
    provider-check-cron: ${ROUTE_SWAP_PROVIDER_CHECK_CRON:0 30 7,15 * * *}
    reassign-enabled: ${ROUTE_SWAP_REASSIGN_ENABLED:false}
    recipients: ${ROUTE_SWAP_ALERT_RECIPIENTS:${GPS_ALERT_RECIPIENTS:}}

  gps-history:
    max-points: 100
    ttl-minutes: 30

  gps-dlq:
    enabled: ${GPS_DLQ_ENABLED:true}
    max-retries: ${GPS_DLQ_MAX_RETRIES:3}
    retry-delay: ${GPS_DLQ_RETRY_DELAY:1m}
    retry-multiplier: ${GPS_DLQ_RETRY_MULTIPLIER:2.0}
    max-retry-delay: ${GPS_DLQ_MAX_RETRY_DELAY:30m}
    ttl: ${GPS_DLQ_TTL:24h}
    retry-batch-size: ${GPS_DLQ_RETRY_BATCH_SIZE:50}
    log-failures: ${GPS_DLQ_LOG_FAILURES:true}
    retry-interval: ${GPS_DLQ_RETRY_INTERVAL:60000}

  position-change:
    position-delta-threshold: 0.00005
    speed-delta-threshold-kmh: 2.0
    min-speed-for-motion-kmh: 3.0

  gps-outlier-detection:
    enabled: ${GPS_OUTLIER_DETECTION_ENABLED:true}
    max-implied-speed-kmh: ${GPS_OUTLIER_MAX_SPEED:150.0}
    min-time-difference: ${GPS_OUTLIER_MIN_TIME_DIFF:3s}
    max-time-difference: ${GPS_OUTLIER_MAX_TIME_DIFF:60s}
    min-distance-meters: ${GPS_OUTLIER_MIN_DISTANCE:10.0}
    consecutive-outliers-for-alert: ${GPS_OUTLIER_CONSECUTIVE_ALERT:2}
    reject-outliers: ${GPS_OUTLIER_REJECT:true}
    history-points-to-check: ${GPS_OUTLIER_HISTORY_POINTS:3}
    min-speed-for-frozen-detection-kmh: ${GPS_OUTLIER_FROZEN_SPEED_THRESHOLD:10.0}
    reject-frozen-motion: ${GPS_OUTLIER_REJECT_FROZEN:false}
    frozen-warn-dedup-interval: ${GPS_OUTLIER_FROZEN_WARN_DEDUP:10m}
    frozen-chronic-threshold: ${GPS_OUTLIER_FROZEN_CHRONIC_THRESHOLD:10m}
    frozen-episode-retention: ${GPS_OUTLIER_FROZEN_RETENTION:30m}

  subscription:
    monthly-amount-minor: ${SUBSCRIPTION_MONTHLY_AMOUNT_MINOR:400}
    yearly-amount-minor: ${SUBSCRIPTION_YEARLY_AMOUNT_MINOR:4000}
    currency: ${SUBSCRIPTION_CURRENCY:TMT}
    payment-session-minutes: ${SUBSCRIPTION_PAYMENT_SESSION_MIN:30}
    payment-return-url: ${SUBSCRIPTION_PAYMENT_RETURN_URL:https://admduralga.ulgam.biz/api/v1/payments/return}
    payment-status-sync-timeout-ms: ${SUBSCRIPTION_STATUS_SYNC_TIMEOUT_MS:3000}
    expiry-scheduler:
      enabled: ${SUBSCRIPTION_EXPIRY_SCHEDULER_ENABLED:false}
      batch-size: ${SUBSCRIPTION_EXPIRY_BATCH_SIZE:100}
      fixed-delay-ms: ${SUBSCRIPTION_EXPIRY_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${SUBSCRIPTION_EXPIRY_INITIAL_DELAY_MS:60000}

cache:
  redis:
    routes-ttl: 3600
    stops-ttl: 7200
    vehicle-positions-ttl: 60
    search-results-ttl: 300
    operations:
      read-timeout: 5s
      write-timeout: 5s
      batch-timeout: 10s
    key-prefix:
      routes: "routes:"
      stops: "stops:"
      vehicles: "vehicles:"
      search: "search:"

websocket:
  max-connections: 10000
  heartbeat-interval: 30
  message-buffer-size: 1024
  connection-timeout: 60

distributed-lock:
  enabled: ${DISTRIBUTED_LOCK_ENABLED:true}
  default-timeout: ${DISTRIBUTED_LOCK_DEFAULT_TIMEOUT:3m}
  acquire-timeout: ${DISTRIBUTED_LOCK_ACQUIRE_TIMEOUT:10s}
  retry-interval: ${DISTRIBUTED_LOCK_RETRY_INTERVAL:100ms}
  key-prefix: ${DISTRIBUTED_LOCK_KEY_PREFIX:lock:}
  gps-scheduler-lock-timeout: ${GPS_SCHEDULER_LOCK_TIMEOUT:30s}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      gpsApi:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5m
      gpsApiTugdk:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5m
      busInfoApi:
        base-config: default
        sliding-window-size: 15
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3m
      postgresRouting:
        base-config: default
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - io.r2dbc.spi.R2dbcException
          - io.r2dbc.spi.R2dbcTimeoutException
          - org.springframework.r2dbc.BadSqlGrammarException
          - java.util.concurrent.TimeoutException
      nominatimApi:
        base-config: default
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
      osrmApi:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3

  ratelimiter:
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1s
    instances:
      searchApi:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 0s
      gpsApi:
        limit-for-period: 30
        limit-refresh-period: 1s
      gpsApiTugdk:
        limit-for-period: 30
        limit-refresh-period: 1s
      busInfoApi:
        limit-for-period: 20
        limit-refresh-period: 1s
      adminLogin:
        limit-for-period: ${RATE_LIMIT_ADMIN_LOGIN_PER_MINUTE:10}
        limit-refresh-period: 1m
        timeout-duration: 0s
      clientLogin:
        limit-for-period: ${RATE_LIMIT_CLIENT_LOGIN_PER_MINUTE:20}
        limit-refresh-period: 1m
        timeout-duration: 0s

  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 0ms
    instances:
      gpsApi:
        max-concurrent-calls: 5
      gpsApiTugdk:
        max-concurrent-calls: 5
      busInfoApi:
        max-concurrent-calls: 3

  timelimiter:
    configs:
      default:
        timeout-duration: 60s
    instances:
      gpsApi:
        timeout-duration: 60s
      gpsApiTugdk:
        timeout-duration: 60s
      busInfoApi:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,ratelimiters
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        resilience4j.circuitbreaker.calls: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    biz.ugur.busroutebackend: WARN
    biz.ugur.busroutebackend.transport.scheduler: INFO
    biz.ugur.busroutebackend.shared.application.MaterializedViewRefreshService: WARN
    biz.ugur.busroutebackend.transport.application.usecase.UpdateVehiclePositionsUseCase: WARN
    biz.ugur.busroutebackend.transport.application.service.GpsDataAggregatorService: WARN
    biz.ugur.busroutebackend.transport.infrastructure.messaging: INFO
    biz.ugur.busroutebackend.transport.infrastructure.prediction.LiveFactorShadowLogger: INFO
    biz.ugur.busroutebackend.transport.infrastructure.prediction.SegmentObservationRecorder: INFO
    biz.ugur.busroutebackend.shared.infrastructure.security: INFO
    biz.ugur.busroutebackend.admin.infrastructure.security: INFO
    biz.ugur.busroutebackend.interfaces.websocket: INFO
    biz.ugur.busroutebackend.transport.infrastructure.metrics.GpsOutlierMetricsRecorder: ${GPS_PIPELINE_LOG_LEVEL:ERROR}
    biz.ugur.busroutebackend.transport.infrastructure.prediction.GpsOutlierFilter: ${GPS_PIPELINE_LOG_LEVEL:ERROR}
    biz.ugur.busroutebackend.transport.infrastructure.prediction.snap.PlausibilityChecker: ${GPS_PIPELINE_LOG_LEVEL:ERROR}
    biz.ugur.busroutebackend.transport.infrastructure.prediction.snap.OppositeFallbackStrategy: ${GPS_PIPELINE_LOG_LEVEL:ERROR}
    org.springframework: WARN
    org.hibernate: WARN
    io.r2dbc: WARN
    io.netty: WARN
    org.springframework.web.reactive: ${SPRING_LOG_LEVEL:WARN}
    org.springframework.data: ${DATA_LOG_LEVEL:WARN}
    org.springframework.r2dbc: ${R2DBC_LOG_LEVEL:WARN}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/bus-route-backend.log}
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  http2:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
  max-http-request-header-size: 1MB

routing:
  raptor:
    default-headway-seconds: ${RAPTOR_DEFAULT_HEADWAY_SECONDS:600}
    service-day-start: ${RAPTOR_SERVICE_DAY_START:06:00}
    service-day-end: ${RAPTOR_SERVICE_DAY_END:23:00}
    service-id: ${RAPTOR_SERVICE_ID:ALL_DAYS}
    max-rounds: ${RAPTOR_MAX_ROUNDS:4}
    cache-ttl-minutes: ${RAPTOR_CACHE_TTL_MINUTES:30}
    transfer-radius-meters: ${RAPTOR_TRANSFER_RADIUS_METERS:200}
    transfer-walking-speed-kmh: ${RAPTOR_TRANSFER_WALKING_SPEED_KMH:5.0}
    timetable-generation:
      enabled: ${RAPTOR_TIMETABLE_GENERATION_ENABLED:false}


springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /docs
    display-request-duration: true
    groups-order: DESC
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false
  group-configs:
    - group: v1
      paths-to-match: /api/v1/**
      display-name: "API V1 (Current)"

ugur:
  prediction:
    enabled: ${PREDICTION_ENABLED:true}
    interval-ms: ${PREDICTION_INTERVAL_MS:1000}
    max-age-ms: ${PREDICTION_MAX_AGE_MS:180000}
    min-speed-kmh: ${PREDICTION_MIN_SPEED_KMH:3.0}
    decay-factor: ${PREDICTION_DECAY_FACTOR:0.98}
    max-advance-leash-meters: ${PREDICTION_MAX_ADVANCE_LEASH_METERS:250.0}
    correction-factor: ${PREDICTION_CORRECTION_FACTOR:0.7}
    snap-to-route: ${PREDICTION_SNAP_TO_ROUTE:true}
    stop-deceleration-zone-meters: ${PREDICTION_STOP_DECEL_ZONE:80.0}
    stop-deceleration-min-factor: ${PREDICTION_STOP_DECEL_MIN:0.15}
  diagnostics:
    tracked-plates: ${TRACKED_PLATES:}
    tracked-device-ids: ${TRACKED_DEVICE_IDS:}
    tracked-routes: ${TRACKED_ROUTES:}
  catalog-search:
    enabled: ${CATALOG_SEARCH_ENABLED:false}
    word-similarity-threshold: ${CATALOG_SEARCH_WSIM_THRESHOLD:0.6}
    rebuild-cron: ${CATALOG_SEARCH_REBUILD_CRON:0 0 4 * * *}
    rebuild-zone: Asia/Ashgabat
    cache-ttl-seconds: ${CATALOG_SEARCH_CACHE_TTL:180}
    federation-enabled: ${CATALOG_SEARCH_FEDERATION:true}
    place-score-factor: ${CATALOG_SEARCH_PLACE_FACTOR:1.0}
    place-timeout-ms: ${CATALOG_SEARCH_PLACE_TIMEOUT_MS:800}
    geo-boost-factor: ${CATALOG_SEARCH_GEO_BOOST:0.5}

gps:
  recorder:
    enabled: ${GPS_RECORDER_ENABLED:false}
    output-dir: ${GPS_RECORDER_OUTPUT_DIR:logs/fixtures}
    max-duration-sec: ${GPS_RECORDER_MAX_DURATION_SEC:3600}
    campaign-enabled: ${GPS_RECORDER_CAMPAIGN_ENABLED:false}
    session-duration-sec: ${GPS_RECORDER_SESSION_DURATION_SEC:3600}
    session-prefix: ${GPS_RECORDER_SESSION_PREFIX:campaign}
    roll-check-interval-sec: ${GPS_RECORDER_ROLL_CHECK_INTERVAL_SEC:30}
    routes: ${GPS_RECORDER_ROUTES:}

payment:
  scheduler:
    enabled: true
    stale-after-seconds: 180
    batch-size: 50
    fixed-delay-ms: 120000
    initial-delay-ms: 60000

  svepg:
    timeout-millis: ${PAYMENT_TIMEOUT_MS:15000}
    banks:
      RYSGAL:
        enabled: ${PAYMENT_RYSGAL_ENABLED:false}
        base-url: ${PAYMENT_RYSGAL_URL:}
        user-name: ${PAYMENT_RYSGAL_USER:}
        password: ${PAYMENT_RYSGAL_PASS:}
        terminal-id: ${PAYMENT_RYSGAL_TERMINAL_ID:}
        pid: ${PAYMENT_RYSGAL_PID:}
      SENAGAT:
        enabled: ${PAYMENT_SENAGAT_ENABLED:false}
        base-url: ${PAYMENT_SENAGAT_URL:}
        user-name: ${PAYMENT_SENAGAT_USER:}
        password: ${PAYMENT_SENAGAT_PASS:}
      BKB:
        enabled: ${PAYMENT_BKB_ENABLED:false}
        base-url: ${PAYMENT_BKB_URL:}
        user-name: ${PAYMENT_BKB_USER:}
        password: ${PAYMENT_BKB_PASS:}
      HALK:
        enabled: ${PAYMENT_HALK_ENABLED:false}
        base-url: ${PAYMENT_HALK_URL:}
        user-name: ${PAYMENT_HALK_USER:}
        password: ${PAYMENT_HALK_PASS:}

advertising:
  events:
    partition:
      enabled: ${AD_EVENT_PARTITION_ENABLED:true}
      lookahead-months: 2
      cron: "0 0 3 * * *"
      zone: "UTC"

