business:
  routing:
    nearby-stops-radius: 800
    max-transfers: 2
    max-search-results: 3
    max-transfer-wait-time: 30
    walking-speed: 5.0

  vehicle-tracking:
    position-update-interval: 30
    position-max-age: 5
    stop-arrival-radius: 50

    route-assignment-priority:
      - SHIFT_ASSIGNMENT
      - GPS_DETECTED
      - MANUAL

  # ЗАКОММЕНТИРОВАНО 2025-12-23: Bus Info API sync больше не используется
  # bus-info:
  #   sync-interval: 24
  #   sync-time: "06:00"

  garage:
    entry-detection:
      min-idle-time-minutes: 10
      speed-threshold-kmh: 2.0

    exit-detection:
      min-distance-meters: 50
      min-speed-kmh: 5.0

  gps-route-detection:
    enabled: true
    check-interval-seconds: 30
    min-gps-points: 5
    deviation-threshold-meters: 500
    min-confidence-percentage: 70.0
    max-distance-for-match-meters: 100

  gps-history:
    max-points: 100
    ttl-minutes: 30

cache:
  redis:
    routes-ttl: 3600
    stops-ttl: 7200
    vehicle-positions-ttl: 60
    search-results-ttl: 300
    key-prefix:
      routes: "routes:"
      stops: "stops:"
      vehicles: "vehicles:"
      search: "search:"

websocket:
  max-connections: 10000
  heartbeat-interval: 30
  message-buffer-size: 1024
  connection-timeout: 60



resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
    instances:
      gpsApi:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5m
      busInfoApi:
        base-config: default
        sliding-window-size: 15
        failure-rate-threshold: 50
        wait-duration-in-open-state: 3m
      postgresRouting:
        base-config: default
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - io.r2dbc.spi.R2dbcException
          - io.r2dbc.spi.R2dbcTimeoutException
          - org.springframework.r2dbc.BadSqlGrammarException
          - java.util.concurrent.TimeoutException

  ratelimiter:
    configs:
      default:
        limit-for-period: 10
        limit-refresh-period: 1s
    instances:
      searchApi:
        limit-for-period: 10
        limit-refresh-period: 60s
        timeout-duration: 0s
      gpsApi:
        limit-for-period: 30
        limit-refresh-period: 1s
      busInfoApi:
        limit-for-period: 20
        limit-refresh-period: 1s

  bulkhead:
    configs:
      default:
        max-concurrent-calls: 10
        max-wait-duration: 0ms
    instances:
      gpsApi:
        max-concurrent-calls: 5
      busInfoApi:
        max-concurrent-calls: 3

  timelimiter:
    configs:
      default:
        timeout-duration: 60s
    instances:
      gpsApi:
        timeout-duration: 60s
      busInfoApi:
        timeout-duration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,ratelimiters
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: always
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        resilience4j.circuitbreaker.calls: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}

logging:
  level:
    biz.ugur.busroutebackend: ${LOG_LEVEL:INFO}
    org.springframework.web.reactive: ${SPRING_LOG_LEVEL:WARN}
    org.springframework.data: ${DATA_LOG_LEVEL:WARN}
    org.springframework.r2dbc: ${R2DBC_LOG_LEVEL:WARN}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/bus-route-backend.log}
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  http2:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
  max-http-request-header-size: 1MB

routing:
  stop-based-search:
    enabled: true
    timeout-seconds: 18
    max-results: 6
    max-layers: 3

    validation:
      max-walking-distance-meters: 800
      min-travel-minutes: 2
      max-travel-minutes: 120
      max-transfer-travel-minutes: 150
      max-transfer-wait-minutes: 15


    layers:
      radiuses: [0.3, 0.6, 1.0]
      transfer-distances: [0.3, 0.4, 0.5]
      max-stops-per-layer: [4, 6, 8]


springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /docs
    display-request-duration: true
    groups-order: DESC
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false
  group-configs:
    - group: v1
      paths-to-match: /api/v1/**
      display-name: "API V1 (Current)"
