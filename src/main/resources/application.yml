spring:
  application:
    name: bus-route-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD:bus_route_pass}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bus_route_db}
    username: ${DB_USERNAME:bus_route_user}
    password: ${DB_PASSWORD:bus_route_pass}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:bus_route_db}
    pool:
      initial-size: ${DB_POOL_MIN_IDLE:2}
      max-size: ${DB_POOL_MAX_SIZE:10}
      max-idle-time: 30m
      max-acquire-time: 60s
      max-create-connection-time: 60s
      validation-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    schemas: public

  webflux:
    base-path: /api/v1
    multipart:
      max-in-memory-size: 5MB
      max-disk-usage-per-part: 10MB
      max-parts: 10

  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-durations-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null




app:
  scheduling:
    enabled: false
  admin:
    default-username: ${ADMIN_DEFAULT_USERNAME:admin}
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}
    password-expiry-days: 90
    validation:
      coordinates:
        turkmenistan:
          min-latitude: 35.0
          max-latitude: 43.0
          min-longitude: 52.0
          max-longitude: 67.0


  security:
    jwt:
      secret:  ${JWT_SECRET:at-least-32-characters-long-secret-key-here}
      access-token-expiration: "PT1H"    # 1 hour
      refresh-token-expiration: "P7D"    # 7 days
      issuer: "bus-route-system"

external:
  api:
    gps:
      base-url:  https://gps.tugdk.gov.tm #http://disabled-api.local
      token: ${GPS_API_TOKEN:RzBFAiAXi8BptuCSC_g7z-YrCnAK9GXhdT4RCqG6YPymO51TSgIhALFe-uQ4S2Pm-pojsla3SRRTy02MmfsJT3ypjwvpDFK9eyJ1IjoxMywiZSI6IjIwMjYtMTItMjNUMTk6MDA6MDAuMDAwKzAwOjAwIn0}
      timeout: 10s
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s
      rate-limit:
        requests-per-minute: 120

    bus-info:
      base-url: https://edu.ayauk.gov.tm/gps/buses #http://disabled-api.local
      username: ${BUS_INFO_API_USERNAME:turkmenportal}
      password: ${BUS_INFO_API_PASSWORD:turkmenportal}
      timeout: 10s
      retry:
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2.0
        max-interval: 10s

business:
  routing:
    nearby-stops-radius: 800
    max-transfers: 2
    max-search-results: 5
    max-transfer-wait-time: 30
    walking-speed: 5.0

  vehicle-tracking:
    position-update-interval: 30
    position-max-age: 5
    stop-arrival-radius: 50

  bus-info:
    sync-interval: 24
    sync-time: "06:00"

cache:
  redis:
    routes-ttl: 3600
    stops-ttl: 7200
    vehicle-positions-ttl: 60
    search-results-ttl: 300
    key-prefix:
      routes: "routes:"
      stops: "stops:"
      vehicles: "vehicles:"
      search: "search:"

websocket:
  max-connections: 10000
  heartbeat-interval: 30
  message-buffer-size: 1024
  connection-timeout: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99

logging:
  level:
    biz.ugur.busroutebackend: ${LOG_LEVEL:INFO}
    org.springframework.web.reactive: ${SPRING_LOG_LEVEL:WARN}
    org.springframework.data: ${DATA_LOG_LEVEL:WARN}
    org.springframework.r2dbc: ${R2DBC_LOG_LEVEL:WARN}
    org.flywaydb: ${FLYWAY_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/bus-route-backend.log}
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  http2:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always
  max-http-request-header-size: 1MB
