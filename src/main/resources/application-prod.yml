spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 30000

  jpa:
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

  data:
    redis:
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
      timeout: 5000ms

logging:
  level:
    tm.gov.busroute: INFO
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: logs/bus-route-backend.log

websocket:
  max-connections: 50000
  heartbeat-interval: 60

server:
  compression:
    enabled: true
  http2:
    enabled: true
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never